name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxcb-cursor0 libxkbcommon-x11-0 libnss3 \
            libatk-bridge2.0-0 libgtk-3-0 libdrm2 libgbm1 \
            fuse3 libfuse2 xdg-utils
      - run: npm ci
      - name: Build AppImage
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "electron-builder path: $(which electron-builder || echo 'not in PATH')"
          ls -la node_modules/.bin/electron-builder 2>/dev/null || echo 'electron-builder bin not found'
          npx --yes electron-builder --linux --verbose 2>&1 | tail -100
      - uses: actions/upload-artifact@v4
        with:
          name: symdy-linux
          path: dist/*.AppImage

  create-release:
    needs: [build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Symdy ${{ github.ref_name }}
          body: |
            ## What's new in Symdy ${{ github.ref_name }}

            A desktop AI companion with persistent memory, built on the pi agent framework.

            ### Quick Start
            1. Download the AppImage for Linux
            2. Make it executable: `chmod +x Symdy-*.AppImage`
            3. Run it: `./Symdy-*.AppImage`
            4. Requires pi installed globally: `npm install -g @earendil-works/pi-coding-agent`

            ### Platform Status
            - ✅ Linux (AppImage) — tested & working
            - ⏳ macOS — build in progress
            - ⏳ Windows — build in progress
          files: |
            artifacts/symdy-linux/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
