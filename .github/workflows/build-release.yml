name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxcb-cursor0 libxkbcommon-x11-0 libnss3 \
            libatk-bridge2.0-0 libgtk-3-0 libdrm2 libgbm1 \
            fuse3 libfuse2 xdg-utils
      - run: npm ci
      - name: Verify Electron
        run: |
          if [ ! -f node_modules/electron/dist/electron ]; then
            echo "Electron binary not found, running install script..."
            node node_modules/electron/install.js
          fi
          ls -lh node_modules/electron/dist/electron
      - name: Check disk space
        run: |
          echo "=== Disk space before build ==="
          df -h /
          du -sh node_modules/ node_modules/electron/dist/ 2>/dev/null || true
      - name: Build AppImage
        run: |
          echo "Starting electron-builder..."
          node node_modules/electron-builder/cli.js --linux 2>&1 || {
            echo "=== Build failed! Debug info: ==="
            echo "=== dist/ contents: ==="
            ls -la dist/ 2>/dev/null || echo "no dist/"
            echo "=== node_modules/.cache contents: ==="
            du -sh node_modules/.cache/ 2>/dev/null || echo "no cache"
            echo "=== Disk space after failure: ==="
            df -h /
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: symdy-linux
          path: dist/*.AppImage

  create-release:
    needs: [build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List downloaded artifacts (debug)
        run: |
          echo "=== Artifact directory structure ==="
          find artifacts -type f -ls 2>/dev/null || echo "No files found in artifacts/"
          echo "=== dist/ contents ==="
          ls -la dist/ 2>/dev/null || echo "No dist/ directory"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Symdy ${{ github.ref_name }}
          body: |
            ## What's new in Symdy ${{ github.ref_name }}

            A desktop AI companion with persistent memory, built on the pi agent framework.

            ### Quick Start
            1. Download the AppImage for Linux
            2. Make it executable: `chmod +x Symdy-*.AppImage`
            3. Run it: `./Symdy-*.AppImage`
            4. Requires pi installed globally: `npm install -g @earendil-works/pi-coding-agent`

            ### Platform Status
            - ✅ Linux (AppImage) — tested & working
            - ⏳ macOS — build in progress
            - ⏳ Windows — build in progress
          files: |
            artifacts/*.AppImage
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
